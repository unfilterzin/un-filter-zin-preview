<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Reel Preview · One-click Player</title>
  <meta name="description" content="Instant preview of the newest cinematic Reel.">
  <style>
    :root { font-family: Inter, system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 50% 0%, #273047 0%, #11151f 42%, #080a0e 100%); color: #fff; }
    .wrap { width: min(100%, 900px); margin: auto; padding: clamp(14px, 3vw, 28px) 14px 36px; }
    .heading { display:flex; align-items: baseline; justify-content:space-between; gap:12px; margin-bottom:18px; }
    h1 { font-size: clamp(20px, 4vw, 29px); margin:0; font-weight:800; letter-spacing:-.04em; }
    .label { color:#b9c1d1; font-size:13px; }
    .stage { margin:auto; width:min(100%, 380px); position:relative; aspect-ratio:9/16; background: #07080b; border-radius: 19px; overflow:hidden; box-shadow: 0 16px 60px #000b, 0 0 0 1px #ffffff1a; }
    video { width:100%;height:100%;object-fit:contain;display:block;background:#050608; }
    .posterStatus { position:absolute; bottom:76px; inset-inline:15px; text-align:center; pointer-events:none; font-size:12px; color:white; text-shadow:0 1px 2px black; }
    .buttons { display:flex; flex-wrap:wrap; justify-content:center; gap:9px; margin:17px auto 8px; }
    button { background:#252b39; color:#fff; font:600 14px/1.3 inherit; padding:12px 18px; border:1px solid #ffffff2b; border-radius:12px; cursor:pointer; min-width:116px; }
    button:focus-visible { outline: 3px solid #f9cb5f; outline-offset:3px; }
    .primary { background:#e7b540; color:#1a1205; border-color: transparent; }
    #status { text-align:center; min-height:23px; font-size:13px; color:#b8c0ce; margin:12px 0; }
    .hint { line-height:1.5; text-align:center; color:#969faf; font-size:12px; max-width:520px; margin:10px auto; }
    .warning { background:#4b2222; border:1px solid #a03f3f; color:#ffd6d6; padding:10px 12px; border-radius:10px; display:none; font-size:13px; margin:auto; max-width:520px; }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior:auto !important; } }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="heading"><h1>Reel Preview</h1><span class="label">Latest version</span></div>
    <div class="stage">
      <video id="reel" autoplay muted playsinline controls preload="auto" poster="poster.jpg" aria-label="Latest motivational Reel">
        <source id="videoSrc" src="latest.mp4" type="video/mp4">
        Your browser doesn't support MP4 video.
      </video>
    </div>
    <div class="buttons">
      <button type="button" id="sound" class="primary">🔊 Turn sound on</button>
      <button type="button" id="restart">↻ Replay</button>
      <button type="button" id="fullscreen">⛶ Fullscreen</button>
    </div>
    <p id="status" role="status" aria-live="polite">Opening preview…</p>
    <p id="error" class="warning" role="alert"></p>
    <p class="hint">The video begins automatically with sound muted, as required by Chrome autoplay rules. Click “Turn sound on” to hear it. This page updates whenever latest.mp4 is replaced on your preview site.</p>
  </main>
  <script>
    (() => {
      'use strict';
      const reel = document.getElementById('reel');
      const sound = document.getElementById('sound');
      const status = document.getElementById('status');
      const error = document.getElementById('error');
      const src = document.getElementById('videoSrc');
      // Refresh the actual media each visit, so a newly generated version appears.
      src.src = 'latest.mp4?v=' + Date.now();
      reel.load();
      const report = message => { status.textContent = message; };
      const play = async () => {
        try { await reel.play(); report(reel.muted ? 'Playing · sound is off' : 'Playing · sound on'); }
        catch (_) { report('Chrome paused autoplay. Tap the video to play.'); }
      };
      reel.addEventListener('canplay', play, { once:true });
      reel.addEventListener('playing', () => report(reel.muted ? 'Playing · sound is off' : 'Playing · sound on'));
      reel.addEventListener('pause', () => { if (!reel.ended) report('Paused'); });
      reel.addEventListener('ended', () => report('Finished · tap Replay to watch again'));
      reel.addEventListener('error', () => {
        error.style.display = 'block';
        error.textContent = 'The Reel could not load. Ensure latest.mp4 has been uploaded next to index.html and the GitHub Pages site has finished publishing.';
        report('Video unavailable');
      });
      sound.addEventListener('click', async () => {
        reel.muted = !reel.muted;
        sound.textContent = reel.muted ? '🔊 Turn sound on' : '🔇 Mute';
        if (reel.paused) await play();
        else report(reel.muted ? 'Playing · sound is off' : 'Playing · sound on');
      });
      document.getElementById('restart').addEventListener('click', async () => { reel.currentTime=0; await play(); });
      document.getElementById('fullscreen').addEventListener('click', async () => {
        if (document.fullscreenElement) await document.exitFullscreen();
        else if (reel.requestFullscreen) await reel.requestFullscreen();
        else if (reel.webkitEnterFullscreen) reel.webkitEnterFullscreen();
      });
    })();
  </script>
</body>
</html>
